run:
  name: baseline
  seed: 42
  device: auto
  output_root: runs
  save_arrays: true

data:
  root: data
  dataset_file: 1deg_ocean_heat_emulator_data.nc
  variables:
    - area_t
    - ocean_heat_content_2d
    - total_surface_heat_flx
  drop_coordinates:
    - geolat_t
    - geolon_t
  drop_variables:
    - area_t
  sort_order:
    - time
    - latitude
    - longitude
  time_start: "2000-06"
  time_end: "2001-01"
  time_interval: "1 month"
  fill_nan: 0.0
  reshape_pattern: "c t h w -> t c h w"

model:
  input_channels: 2
  output_channels: 2
  encoder:
    - out_channels: 16
      kernel_size: 4
      stride: 2
      padding: 1
    - out_channels: 32
      kernel_size: 3
      stride: 2
      padding: 1
    - out_channels: 64
      kernel_size: 7
      stride: 1
      padding: 3
  decoder:
    - out_channels: 32
      kernel_size: 7
      stride: 1
      padding: 3
      upsample_factor: 2
    - out_channels: 16
      kernel_size: 3
      stride: 1
      padding: 1
      upsample_factor: 2
    - out_channels: 2
      kernel_size: 4
      stride: 1
      padding: 2
      upsample_factor: 1
  activation: relu
  final_activation: sigmoid
  upsample_mode: bilinear

normalization:
  strategy: masked_zscore
  scope: per_sample
  eps: 1.0e-6
  robust_quantiles: [0.25, 0.75]

training:
  num_epochs: 30
  max_samples_per_epoch: 500
  learning_rate: 1.0e-4
  print_every: 100
  ignore_sample_errors: true

diagnostics:
  sample_index: 0
  channel_names:
    - OHC
    - HeatFlux
  flux_channel_index: 1
  ohc_channel_index: 0
  flux_scale: 2592000.0
  flux_vmin: -1.0e8
  flux_vmax: 1.0e8
  ohc_vmin: -1.0e13
  ohc_vmax: 1.0e13
  latent_channels: 8
