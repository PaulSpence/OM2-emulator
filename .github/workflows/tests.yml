name: tests

on:
  push:
  pull_request:

jobs:
  pytest-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CPU-only torch keeps the install small; the tests need no GPU.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy xarray netCDF4 matplotlib lightning pytest

      - name: Run tests
        run: pytest test -v -rA
